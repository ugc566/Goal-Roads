<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goal Roads</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#534AB7">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f7f6f2;--s1:#fff;--s2:#efede6;--tx:#1f1f1c;--mu:#6b6a63;--bd:#d6d3c8;--ac:#534AB7;--ab:#eeedfe;--gd:#ba7517;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b19;--s1:#262624;--s2:#30302d;--tx:#f0efe8;--mu:#a3a198;--bd:#45443f;--ac:#afa9ec;--ab:#2c2a4a;--gd:#ef9f27}}
:root[data-theme="dark"]{--bg:#1b1b19;--s1:#262624;--s2:#30302d;--tx:#f0efe8;--mu:#a3a198;--bd:#45443f;--ac:#afa9ec;--ab:#2c2a4a;--gd:#ef9f27}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:12px}
.c{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px}
.cr{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
button{font:inherit;font-size:14px;background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}
input,textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%;box-sizing:border-box}
textarea{min-height:70px;resize:vertical;margin-top:6px}
label{display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.r{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.m{color:var(--mu);font-size:13px}
.ts{border:1px solid var(--gd);color:var(--gd);border-radius:8px;padding:8px;margin-bottom:8px;font-weight:600}
svg{width:100%;display:block;margin-top:8px}
svg text{fill:var(--tx);font-family:inherit}
svg text.mu{fill:var(--mu)}
</style></head><body>
<div class="w" id="app"></div>
<script>
var K="goalroads.v1",C=["#7F77DD","#1D9E75","#D85A30","#378ADD","#BA7517","#D4537E","#639922","#E24B4A"];
var S,path=[],sel=-1,mode=0,lk=-1,arm=0,toast="",dS="",dT="";
var NS="http://www.w3.org/2000/svg";
function $(i){return document.getElementById(i)}
function e(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function tr(t,n){return t.length>n?t.slice(0,n-1)+"…":t}
function el(n,a){var x=document.createElementNS(NS,n);for(var k in a)x.setAttribute(k,a[k]);return x}
function mk(n,N,p,k,c){return{id:S.u++,n:n,N:N,p:p,c:c,notes:{},kids:k||[]}}
function nc(l){var u=l.map(function(x){return x.c});for(var i=0;i<C.length;i++)if(u.indexOf(C[i])<0)return C[i];return C[l.length%C.length]}
function pr(n){if(n.kids.length){var s=0;n.kids.forEach(function(k){s+=pr(k)});return s/n.kids.length}return n.p/n.N}
function sv(){try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}}
function ld(){try{var t=localStorage.getItem(K);if(t){S=JSON.parse(t);return}}catch(x){}
S={u:1,links:[],goals:[]};
var a=mk("Pakistan affairs",20,6.5,0,C[0]),b=mk("Current affairs",30,9.5,0,C[1]),c=mk("Islamiat",20,7,0,C[2]);
var gk=mk("GK",30,0,[a,b,c],C[5]),es=mk("Essay marks",12,3.5,0,C[0]),wr=mk("Writing",30,6.3,0,C[1]);
var m1=mk("PMS Punjab exam",30,0,[gk,es,wr],C[3]);
var w=mk("Walk daily",30,12,0,C[0]),ns=mk("No sugar",30,9,0,C[1]);
S.goals=[m1,mk("Fitness",30,0,[w,ns],C[1])]}
function hub(){return path.length?path[path.length-1]:null}
function cr(){var h='<button onclick="go(-1)">Home</button>';path.forEach(function(n,i){h+='<span class="m">›</span>'+(i==path.length-1?'<b>'+e(tr(n.n,16))+'</b>':'<button onclick="go('+i+')">'+e(tr(n.n,16))+'</button>')});return'<div class="cr">'+h+'</div>'}
function go(i){path=path.slice(0,i+1);sel=-1;arm=0;toast="";R()}
function R(k){if(!k&&$("nt")){dT=$("nt").value;dS=$("ns").value}
$("app").innerHTML=cr()+(path.length?HV():HM());post()}
function HM(){var n=S.goals.length,H=Math.max(160,Math.ceil(n/2)*150+20),p={},s='<div class="c"><div class="r"><b>My main goals</b><button onclick="mode=!mode;lk=-1;R()">'+(mode?"Done linking":"Link goals")+'</button></div>';
if(mode)s+='<div class="m">Tap two goals to link or unlink them.</div>';
s+='<svg viewBox="0 0 380 '+H+'">';
S.goals.forEach(function(g,i){p[g.id]=[95+(i%2)*190,75+Math.floor(i/2)*150]});
S.links.forEach(function(l){var a=p[l[0]],b=p[l[1]];if(a&&b)s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="var(--ac)" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>'});
S.goals.forEach(function(g,i){var x=p[g.id][0],y=p[g.id][1],f=pr(g);
s+='<g style="cursor:pointer" onclick="tg('+i+')">'+(lk==i?'<circle cx="'+x+'" cy="'+y+'" r="58" fill="none" stroke="var(--ac)" stroke-width="2"/>':'')+'<circle cx="'+x+'" cy="'+y+'" r="46" fill="var(--s1)" stroke="var(--s2)" stroke-width="9"/><circle cx="'+x+'" cy="'+y+'" r="46" fill="none" stroke="'+g.c+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(f*2*Math.PI*46)+' 999" transform="rotate(-90 '+x+' '+y+')"/><text x="'+x+'" y="'+(y+6)+'" text-anchor="middle" font-size="17" font-weight="600">'+Math.round(f*100)+'%</text><text x="'+x+'" y="'+(y+74)+'" text-anchor="middle" font-size="13" font-weight="600">'+e(tr(g.n,18))+'</text></g>'});
if(!n)s+='<text x="190" y="80" text-anchor="middle" font-size="14" class="mu">No goals yet. Add your first one below.</text>';
s+='</svg></div><div class="c"><b>Add a main goal</b><div class="g2"><input id="nm" placeholder="Clear the exam"/><button class="p" onclick="am()">Add goal</button></div><div class="m" style="margin-top:8px">Works offline. Progress saves on this phone.</div></div>';
return s}
function tg(i){if(mode){if(lk<0)lk=i;else{if(lk!=i)tl(S.goals[lk].id,S.goals[i].id);lk=-1}R();return}path=[S.goals[i]];sel=-1;arm=0;toast="";R()}
function tl(a,b){var j=-1;S.links.forEach(function(l,i){if((l[0]==a&&l[1]==b)||(l[0]==b&&l[1]==a))j=i});if(j>=0)S.links.splice(j,1);else S.links.push([a,b]);sv()}
function am(){var n=$("nm").value.trim();if(!n)return;S.goals.push(mk(n,30,0,0,nc(S.goals)));sv();R()}
function HV(){var h=hub(),k=h.kids,n=k.length,sub=path.length>1,s='<div class="c"><input value="'+e(h.n)+'" onchange="rn(this.value)" aria-label="Goal name"/><svg viewBox="0 0 380 574"><g transform="translate(0,34)">';
k.forEach(function(r,i){var x=n==1?190:28+i*(324/(n-1)),v=n==1?0:(i%2?-12:12),m=190+(x-190)*.6+v,q=190+(x-190)*.12,
d="M"+x+",410 C"+x+",350 "+m+",335 "+m+",275 S"+q+",190 "+q+",108",o=sel<0||sel==i?1:.28,P=r.kids.length>0;
s+='<g id="g'+i+'" opacity="'+o+'" style="cursor:pointer" onclick="pick('+i+')"><path id="b'+i+'" d="'+d+'" fill="none" stroke="'+r.c+'" stroke-opacity=".28" stroke-width="8" stroke-linecap="round"/><path id="f'+i+'" d="'+d+'" fill="none" stroke="'+r.c+'" stroke-width="8"/><path d="'+d+'" fill="none" stroke="#000" stroke-opacity="0" stroke-width="26" pointer-events="stroke"/>'+(P?'<circle cx="'+x+'" cy="410" r="12" fill="var(--s1)" stroke="'+r.c+'" stroke-width="3"/><text x="'+x+'" y="414" text-anchor="middle" font-size="12" font-weight="600">'+r.kids.length+'</text>':'<circle cx="'+x+'" cy="410" r="6" fill="'+r.c+'"/>')+'<text transform="translate('+(x+4)+',522) rotate(-90)" font-size="12" font-weight="600">'+e(tr(r.n,15))+'</text></g>'});
s+=sub?'<circle cx="190" cy="64" r="46" fill="'+h.c+'" fill-opacity=".18" stroke="'+h.c+'" stroke-width="3"/>':'<circle cx="190" cy="64" r="46" fill="var(--ab)" stroke="var(--ac)"/>';
s+='<text x="190" y="60" text-anchor="middle" font-size="14" font-weight="600">'+e(tr(h.n,13))+'</text><text x="190" y="80" text-anchor="middle" font-size="13" class="mu">'+Math.round(pr(h)*100)+'% there</text>';
if(!n)s+='<text x="190" y="250" text-anchor="middle" font-size="14" class="mu">No roads yet. Add one below.</text>';
s+='</g>';
if(sub)s+='<line x1="190" y1="52" x2="190" y2="26" stroke="'+h.c+'" stroke-width="4"/><polygon points="183,32 190,22 197,32" fill="'+h.c+'"/><text x="190" y="14" text-anchor="middle" font-size="12" class="mu">Leads to: '+e(tr(path[path.length-2].n,20))+'</text>';
else s+='<text x="190" y="18" text-anchor="middle" font-size="12" class="mu">Main goal</text>';
return s+'</svg></div>'+PN()+AF()}
function post(){var h=hub();if(!h)return;h.kids.forEach(function(r,i){var b=$("b"+i),f=$("f"+i),g=$("g"+i),L=b.getTotalLength(),fr=pr(r),M=r.kids.length?10:(r.N<=40?r.N:20);
f.setAttribute("stroke-dasharray",L*fr+" "+L);
for(var k=1;k<=M;k++){var t=b.getPointAtLength(L*k/M),d=k/M<=fr+1e-4;
g.appendChild(el("circle",{cx:t.x,cy:t.y,r:M>25?3:4,fill:d?r.c:"var(--s1)",stroke:d?"var(--s1)":r.c,"stroke-width":d?1:1.5}));
if(!r.kids.length&&r.N<=40&&r.notes[k])g.appendChild(el("circle",{cx:t.x+8,cy:t.y-8,r:3,fill:"var(--gd)"}))}
[.25,.5,.75].forEach(function(q){var t=b.getPointAtLength(L*q),x=el("text",{x:t.x+12,y:t.y+5,"font-size":16,style:"fill:"+(fr>=q-1e-4?"var(--gd)":"var(--mu)")});x.textContent=fr>=q-1e-4?"★":"☆";g.appendChild(x)});
var m=b.getPointAtLength(L*fr);g.appendChild(el("circle",{cx:m.x,cy:m.y,r:10,fill:"var(--s1)",stroke:r.c,"stroke-width":4}))})}
function PN(){var h=hub(),r=h.kids[sel],s='<div class="c" id="pn">';
if(toast)s+='<div class="ts">★ '+e(toast)+'</div>';
if(!r)return s+'<div class="m">Tap a road to open its details. A ring with a number means the road has sub-roads. Stars mark 25%, 50% and 75%.</div></div>';
s+='<input value="'+e(r.n)+'" onchange="rr(this.value)" aria-label="Road name"/>';
if(r.kids.length){
s+='<div class="r"><span class="m">Sub-roads</span><b>'+r.kids.length+'</b></div><div class="r"><span class="m">Overall</span><b>'+Math.round(pr(r)*100)+'%</b></div>';
r.kids.slice(0,10).forEach(function(c){s+='<div class="r m"><span>'+e(tr(c.n,24))+'</span><span>'+Math.round(pr(c)*100)+'%</span></div>'});
s+='<button class="p" style="width:100%;margin-top:8px" onclick="op()">Open sub-roads</button>'}
else{var d=Math.floor(r.p+1e-4),f=r.p/r.N,nx=0;[25,50,75,100].forEach(function(q){if(!nx&&q/100>f+1e-4)nx=q});
s+='<div class="g2"><label class="m">Steps done<input type="number" min="0" step="0.25" value="'+r.p+'" onchange="sd(this.value)"/></label><label class="m">Road length (steps)<input type="number" min="1" step="1" value="'+r.N+'" onchange="sl(this.value)"/></label></div>';
s+='<div class="r"><span class="m">'+(f>=1?"Road complete":"Next celebration")+'</span><b>'+(f>=1?"100%":nx+"%")+'</b></div>';
s+='<div class="g2"><button onclick="inc(.25)">+ quarter</button><button onclick="inc(.5)">+ half</button><button onclick="inc(1)">+ full step</button><button onclick="inc(-.25)">− undo quarter</button></div>';
s+='<div style="margin-top:12px"><b>Notes on this road</b></div><label class="m" style="margin-top:6px">Step number<input id="ns" type="number" min="1" value="'+(dS||Math.min(r.N,d+1))+'"/></label><textarea id="nt" placeholder="Today I read 30 pages. Chapter 4.">'+e(dT)+'</textarea><button class="p" style="width:100%;margin-top:6px" onclick="sn()">Save note</button>';
Object.keys(r.notes).sort(function(a,b){return b-a}).forEach(function(k){s+='<div class="r" style="border-top:1px solid var(--bd);margin-top:6px;padding-top:6px;gap:8px;align-items:flex-start"><div><b>Step '+k+'</b><div class="m" style="white-space:pre-wrap">'+e(r.notes[k])+'</div></div><div style="white-space:nowrap"><button onclick="en('+k+')">Edit</button> <button onclick="dn('+k+')">×</button></div></div>'});
s+='<button style="width:100%;margin-top:10px" onclick="op()">Split into sub-roads</button>'}
return s+'<button style="width:100%;margin-top:8px" onclick="rm()">'+(arm==1?"Tap again to remove":"Remove road")+'</button></div>'}
function AF(){var s='<div class="c"><b>Add a road to '+e(tr(hub().n,22))+'</b><div class="g2"><input id="rn2" placeholder="Islamiat"/><input id="rs" type="number" min="1" step="1" value="30" aria-label="Steps"/></div><div class="m" style="margin:4px 0 8px">Name, then road length in steps (30, 365 or any number)</div><button class="p" style="width:100%" onclick="ar()">Add road</button></div>';
if(path.length==1)s+='<button style="width:100%;margin-top:10px" onclick="dm()">'+(arm==2?"Tap again to delete":"Delete this goal")+'</button>';
return s}
function rn(v){hub().n=v.trim()||"Untitled";sv();R()}
function rr(v){hub().kids[sel].n=v.trim()||"Untitled";sv();R()}
function pick(i){sel=sel==i?-1:i;arm=0;toast="";dS="";dT="";R(1);try{$("pn").scrollIntoView({block:"nearest",behavior:"smooth"})}catch(x){}}
function cel(o,n){var a=Math.floor(o*4+1e-4),b=Math.floor(n*4+1e-4);if(b>a)toast=["","First quarter done. The road is real now.","Halfway there. Keep the pace.","Three quarters done. The goal is in sight.","Road complete! Celebrate this one."][b]}
function sp(r,v){var o=r.p/r.N;toast="";arm=0;r.p=Math.min(r.N,Math.max(0,Math.round(v*100)/100));cel(o,r.p/r.N);sv();R()}
function inc(x){var r=hub().kids[sel];sp(r,r.p+x)}
function sd(v){sp(hub().kids[sel],parseFloat(v)||0)}
function sl(v){var r=hub().kids[sel],N=Math.max(1,parseInt(v)||1);r.N=N;if(r.p>N)r.p=N;sv();R()}
function sn(){var r=hub().kids[sel],k=Math.min(r.N,Math.max(1,parseInt($("ns").value)||1)),t=$("nt").value.trim();if(t)r.notes[k]=t;else delete r.notes[k];dS="";dT="";sv();R(1)}
function en(k){var r=hub().kids[sel];dS=k;dT=r.notes[k];R(1);$("nt").focus()}
function dn(k){delete hub().kids[sel].notes[k];sv();R(1)}
function op(){path.push(hub().kids[sel]);sel=-1;arm=0;toast="";R()}
function rm(){if(arm!=1){arm=1;R();return}hub().kids.splice(sel,1);sel=-1;arm=0;sv();R()}
function ar(){var n=$("rn2").value.trim(),N=parseInt($("rs").value)||0,h=hub();if(!n||N<1){toast="Enter a road name and a length of at least 1";R();return}toast="";h.kids.push(mk(n,N,0,0,nc(h.kids)));sel=h.kids.length-1;sv();R()}
function dm(){if(arm!=2){arm=2;R();return}var id=path[0].id;S.goals.splice(S.goals.indexOf(path[0]),1);S.links=S.links.filter(function(l){return l[0]!=id&&l[1]!=id});path=[];sel=-1;arm=0;sv();R()}
ld();R();
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script></body></html>
