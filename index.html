<style>

<div class="w" id="app"></div><div id="md"></div>
<script>
var K="goalroads.v1",C=["#7F77DD","#1D9E75","#D85A30","#378ADD","#BA7517","#D4537E","#639922","#E24B4A"];
var S,path=[],sel=-1,mode=0,lk=-1,arm=0,toast="",dS="",dT="",tree=0,z=0,WW=380,HH=500,TN=[],raf=0,pnz=0,MD=null;
var NS="http://www.w3.org/2000/svg";
function $(i){return document.getElementById(i)}

function nc(l){var u=l.map(function(x){return x.c});for(var i=0;i<C.length;i++)if(u.indexOf(C[i])<0)return C[i];return C[l.length%C.length]}

function tot(n){if(n.kids.length){var s=0;n.kids.forEach(function(k){s+=tot(k)});return s}return n.N}
function sv(){try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}}
function ld(){try{var t=localStorage.getItem(K);if(t){S=JSON.parse(t);return}}catch(x){}
S={u:1,links:[],goals:[]};
var a=mk("Pakistan affairs",20,6.5,0,C[0]),b=mk("Current affairs",30,9.5,0,C[1]),c=mk("Islamiat",20,7,0,C[2]);
var gk=mk("GK",30,0,[a,b,c],C[5]),es=mk("Essay marks",12,3.5,0,C[0]),wr=mk("Writing",30,6.3,0,C[1]);
var m1=mk("PMS Punjab exam",30,0,[gk,es,wr],C[3]);
var w=mk("Walk daily",30,12,0,C[0]),ns=mk("No sugar",30,9,0,C[1]);
S.goals=[m1,mk("Fitness",30,0,[w,ns],C[1])]}
function hub(){return path.length?path[path.length-1]:null}
function cr(){var h='<button onclick="go(-1)">Home</button>';path.forEach(function(n,i){h+='<span class="m">›</span>'+(i==path.length-1?'<b>'+e(tr(n.n,16))+'</b>':'<button onclick="go('+i+')">'+e(tr(n.n,16))+'</button>')});
h+='<button style="margin-left:auto" onclick="tv()">'+(tree?"Back":"Whole picture")+'</button>';return'<div class="cr">'+h+'</div>'}
function go(i){path=path.slice(0,i+1);sel=-1;arm=0;toast="";tree=0;z=0;R()}
function tv(){tree=tree?0:1;z=0;sel=-1;R()}
function R(k){if(!k&&$("nt")){dT=$("nt").value;dS=$("ns").value}
var m=$("mp"),rs=!z,sx=m?m.scrollLeft:0,sy=m?m.scrollTop:0;
$("app").innerHTML=cr()+(tree?TV():path.length?HV():HM());
m=$("mp");if(m){draw();bind(m);if(!rs){m.scrollLeft=sx;m.scrollTop=sy}}}
function HM(){var n=S.goals.length,H=Math.max(160,Math.ceil(n/2)*150+20),p={},s='<div class="c"><div class="r"><b>My main goals</b><button onclick="mode=!mode;lk=-1;R()">'+(mode?"Done linking":"Link goals")+'</button></div>';
if(mode)s+='<div class="m">Tap two goals to link or unlink them.</div>';
s+='<svg viewBox="0 0 380 '+H+'" style="width:100%">';
S.goals.forEach(function(g,i){p[g.id]=[95+(i%2)*190,75+Math.floor(i/2)*150]});
S.links.forEach(function(l){var a=p[l[0]],b=p[l[1]];if(a&&b)s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="var(--ac)" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>'});
S.goals.forEach(function(g,i){var x=p[g.id][0],y=p[g.id][1],f=pr(g);
s+='<g style="cursor:pointer" onclick="tg('+i+')">'+(lk==i?'<circle cx="'+x+'" cy="'+y+'" r="58" fill="none" stroke="var(--ac)" stroke-width="2"/>':'')+'<circle cx="'+x+'" cy="'+y+'" r="46" fill="var(--s1)" stroke="var(--s2)" stroke-width="9"/><circle cx="'+x+'" cy="'+y+'" r="46" fill="none" stroke="'+g.c+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(f*2*Math.PI*46)+' 999" transform="rotate(-90 '+x+' '+y+')"/><text x="'+x+'" y="'+(y+6)+'" text-anchor="middle" font-size="17" font-weight="600">'+Math.round(f*100)+'%</text><text x="'+x+'" y="'+(y+74)+'" text-anchor="middle" font-size="13" font-weight="600">'+e(tr(g.n,18))+'</text></g>'});
if(!n)s+='<text x="190" y="80" text-anchor="middle" font-size="14" class="mu">No goals yet. Add your first one below.</text>';
s+='</svg></div><div class="c"><b>Add a main goal</b><div class="g2"><input id="nm" placeholder="Clear the exam"/><button class="p" onclick="am()">Add goal</button></div><div class="m" style="margin-top:8px">Works offline. Progress saves on this phone.</div></div>';
return s}
function tg(i){if(mode){if(lk<0)lk=i;else{if(lk!=i)tl(S.goals[lk].id,S.goals[i].id);lk=-1}R();return}path=[S.goals[i]];sel=-1;arm=0;toast="";z=0;R()}
function tl(a,b){var j=-1;S.links.forEach(function(l,i){if((l[0]==a&&l[1]==b)||(l[0]==b&&l[1]==a))j=i});if(j>=0)S.links.splice(j,1);else S.links.push([a,b]);sv()}
function am(){var n=$("nm").value.trim();if(!n)return;S.goals.push(mk(n,30,0,0,nc(S.goals)));sv();R()}
function ZB(){return'<div class="cr" style="margin-top:8px"><button onclick="zm(.8)">−</button><button onclick="zm(1.25)">+</button><button onclick="zf()">Fit all</button><span class="m" id="zl"></span></div>'}
function HV(){return'<div class="c"><input value="'+e(hub().n)+'" onchange="rn(this.value)" aria-label="Goal name"/>'+ZB()+'<div id="mp" class="mp"><svg id="sv"></svg></div></div>'+PN()+AF()}
function TV(){return'<div class="c"><b>Whole picture</b><div class="m">Every goal, sub-goal and road. Tap one to open it.</div>'+ZB()+'<div id="mp" class="mp"><svg id="sv"></svg></div></div>'}
function fin(s,W,H){var m=$("mp"),v=$("sv");WW=W;HH=H;if(!z)z=Math.max(.45,Math.min(1.4,(m.clientWidth||360)/W));
v.setAttribute("viewBox","0 0 "+W+" "+H);v.style.width=W*z+"px";v.style.height=H*z+"px";v.innerHTML=s;$("zl").textContent=Math.round(z*100)+"%"}
function draw(){if(tree)drawTree();else drawMap()}
function setZ(nz){pnz=Math.max(.2,Math.min(14,nz));if(raf)return;raf=requestAnimationFrame(function(){raf=0;var m=$("mp"),o=z,cx=(m.scrollLeft+m.clientWidth/2)/o,cy=(m.scrollTop+m.clientHeight/2)/o;z=pnz;draw();m.scrollLeft=cx*z-m.clientWidth/2;m.scrollTop=cy*z-m.clientHeight/2})}
function zm(f){setZ(z*f)}
function zf(){var m=$("mp");z=Math.max(.2,Math.min(m.clientWidth/WW,m.clientHeight/HH));draw();m.scrollLeft=0;m.scrollTop=0}
function bind(m){var pd=0,pz=0;function ds(v){var a=v.touches[0],b=v.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
m.addEventListener("touchstart",function(v){if(v.touches.length==2){pd=ds(v);pz=z}},{passive:true});
m.addEventListener("touchmove",function(v){if(v.touches.length==2&&pd){v.preventDefault();setZ(pz*ds(v)/pd)}},{passive:false});
m.addEventListener("touchend",function(){pd=0},{passive:true})}
function drawMap(){var h=hub(),k=h.kids,n=k.length,sub=path.length>1,sp=n>1?Math.max(56,Math.min(80,340/(n-1))):0,ee=sp*.7,
W=Math.max(380,(n>1?(n-1)*sp:0)+100),cx=W/2,T=k.map(function(x){return tot(x)}),mx=Math.max.apply(null,T.concat([1])),ups=Math.min(26,900/mx),
Ls=T.map(function(t){return Math.max(90,t*ups)}),gy=116,H=gy+Math.max.apply(null,Ls.concat([120]))+150,cw=Math.max(200,(n>1?(n-1)*ee:0)+120),s='';
k.forEach(function(r,i){var o=i-(n-1)/2,xs=cx+o*sp,xe=cx+o*ee,L=Ls[i],ys=gy+L,w=n>1?(i%2?-14:14):0,
d="M"+xs+","+ys+" C"+(xs+w)+","+(ys-L*.4)+" "+(xe-w)+","+(gy+L*.4)+" "+xe+","+gy,op=sel<0||sel==i?1:.28,P=r.kids.length>0;
s+='<g id="g'+i+'" opacity="'+op+'" style="cursor:pointer" onclick="pick('+i+')"><path id="b'+i+'" d="'+d+'" fill="none" stroke="'+r.c+'" stroke-opacity=".3" stroke-width="9" stroke-linecap="round"/><path d="'+d+'" fill="none" stroke="#000" stroke-opacity="0" stroke-width="30" pointer-events="stroke"/>'
+(P?'<circle cx="'+xs+'" cy="'+ys+'" r="12" fill="var(--s1)" stroke="'+r.c+'" stroke-width="3"/><text x="'+xs+'" y="'+(ys+4)+'" text-anchor="middle" font-size="12" font-weight="600">'+r.kids.length+'</text>':'<circle cx="'+xs+'" cy="'+ys+'" r="6" fill="'+r.c+'"/>')
+'<text transform="translate('+(xs+4)+','+(ys+118)+') rotate(-90)" font-size="13" font-weight="600">'+e(tr(r.n,11)+" · "+T[i])+'</text></g>'});
s+='<rect x="'+(cx-cw/2)+'" y="56" width="'+cw+'" height="60" rx="30" '+(sub?'fill="'+h.c+'" fill-opacity=".18" stroke="'+h.c+'" stroke-width="3"':'fill="var(--ab)" stroke="var(--ac)"')+'/><text x="'+cx+'" y="82" text-anchor="middle" font-size="15" font-weight="600">'+e(tr(h.n,26))+'</text><text x="'+cx+'" y="102" text-anchor="middle" font-size="13" class="mu">'+Math.round(pr(h)*100)+'% there · '+tot(h)+' steps</text>';
if(!n)s+='<text x="'+cx+'" y="260" text-anchor="middle" font-size="14" class="mu">No roads yet. Add one below.</text>';
if(sub)s+='<line x1="'+cx+'" y1="54" x2="'+cx+'" y2="28" stroke="'+h.c+'" stroke-width="4"/><polygon points="'+(cx-7)+',34 '+cx+',24 '+(cx+7)+',34" fill="'+h.c+'"/><text x="'+cx+'" y="14" text-anchor="middle" font-size="12" class="mu">Leads to: '+e(tr(path[path.length-2].n,20))+'</text>';
else s+='<text x="'+cx+'" y="18" text-anchor="middle" font-size="12" class="mu">Main goal</text>';
fin(s,W,H);dec()}
function dec(){var h=hub();h.kids.forEach(function(r,i){var b=$("b"+i),g=$("g"+i),L=b.getTotalLength(),fr=pr(r),leaf=!r.kids.length,N=r.N,M=leaf?(N<=60?N:20):10,Q=leaf?N*4:40,ds=Math.max(1,Math.ceil(9/(L/M*z)));
for(var j=ds;j<=M;j+=ds){var t=b.getPointAtLength(L*j/M);
g.appendChild(el("circle",{cx:t.x,cy:t.y,r:3.5,fill:j/M<=fr+1e-4?r.c:"var(--s1)",stroke:r.c,"stroke-width":1.5}));
if(leaf){var c=el("circle",{cx:t.x,cy:t.y,r:9,fill:"transparent"});(function(j){c.addEventListener("click",function(v){v.stopPropagation();if(sel!=i)pick(i);else openNote(i,M==N?j:Math.round(j*N/M))})})(j);g.appendChild(c)}}
var cq=Math.floor(fr*Q+1e-6),sq=L/Q,st=Math.max(1,Math.ceil(9/(sq*z)));if(cq/st>300)st=Math.ceil(cq/300);
var fs=Math.min(4.5,Math.max(1.8,sq*st*.5));
for(var q=st,sd=1;q<=cq;q+=st,sd++){var off=L*q/Q,p1=b.getPointAtLength(off),pa=b.getPointAtLength(Math.max(0,off-.5)),pb=b.getPointAtLength(Math.min(L,off+.5)),dx=pb.x-pa.x,dy=pb.y-pa.y,ln=Math.hypot(dx,dy)||1,sg=(sd%2?1:-1)*fs*.9;
g.appendChild(el("ellipse",{rx:fs*.55,ry:fs,fill:r.c,transform:"translate("+(p1.x-dy/ln*sg)+","+(p1.y+dx/ln*sg)+") rotate("+(Math.atan2(dy,dx)*180/Math.PI-90)+")"}))}
[.25,.5,.75].forEach(function(q){var t=b.getPointAtLength(L*q),x=el("text",{x:t.x+14,y:t.y+5,"font-size":16,style:"fill:"+(fr>=q-1e-4?"var(--gd)":"var(--mu)")});x.textContent=fr>=q-1e-4?"★":"☆";g.appendChild(x)});
if(leaf)Object.keys(r.notes).forEach(function(k){var kk=Math.max(1,Math.min(N,+k)),t=b.getPointAtLength(L*kk/N),f=el("g",{transform:"translate("+t.x+","+t.y+")",style:"cursor:pointer"});
f.innerHTML='<line x1="0" y1="0" x2="0" y2="-20" stroke="var(--gd)" stroke-width="2"/><polygon points="0,-20 14,-15 0,-10" fill="var(--gd)"/><circle cx="4" cy="-10" r="14" fill="transparent"/>';
f.addEventListener("click",function(v){v.stopPropagation();openNote(i,kk)});g.appendChild(f)});
var m=b.getPointAtLength(L*fr);g.appendChild(el("circle",{cx:m.x,cy:m.y,r:8,fill:"var(--s1)",stroke:r.c,"stroke-width":3.5}))})}
function drawTree(){TN=[];var cnt=0,md=0,PW=140,vr={n:"All goals",c:"#888",kids:S.goals,N:0,p:0,notes:{}};
function lay(n,anc,d){var rc={n:n,anc:anc,d:d,k:[],i:TN.length};md=Math.max(md,d);TN.push(rc);
if(n.kids.length){n.kids.forEach(function(c){rc.k.push(lay(c,d?anc.concat([n]):anc,d+1))});rc.y=(rc.k[0].y+rc.k[rc.k.length-1].y)/2}else rc.y=24+(cnt++)*36;return rc}
var rt=lay(vr,[],0),s='',X=function(d){return 10+d*(PW+36)};
TN.forEach(function(rc){rc.k.forEach(function(c){var x1=X(rc.d)+PW,x2=X(c.d);s+='<path d="M'+x1+','+rc.y+' C'+(x1+18)+','+rc.y+' '+(x2-18)+','+c.y+' '+x2+','+c.y+'" fill="none" stroke="var(--bd)" stroke-width="2"/>'})});
TN.forEach(function(rc){var x=X(rc.d),f=pr(rc.n),c=rc.d?rc.n.c:"var(--ac)";
s+='<g style="cursor:pointer" onclick="tn('+rc.i+')"><rect x="'+x+'" y="'+(rc.y-14)+'" width="'+PW+'" height="28" rx="8" fill="var(--s1)" stroke="'+c+'" stroke-width="1.5"/><rect x="'+(x+1)+'" y="'+(rc.y-13)+'" width="'+(f*(PW-2))+'" height="26" rx="7" fill="'+c+'" fill-opacity=".25"/><text x="'+(x+8)+'" y="'+(rc.y+4)+'" font-size="12" font-weight="600">'+e(tr(rc.n.n,12))+'</text><text x="'+(x+PW-6)+'" y="'+(rc.y+4)+'" text-anchor="end" font-size="11" class="mu">'+Math.round(f*100)+'%</text></g>'});
fin(s,(md+1)*(PW+36)+10,Math.max(120,cnt*36+30))}
function tn(i){var rc=TN[i];tree=0;z=0;arm=0;toast="";
if(rc.d==0){path=[];sel=-1}else if(!rc.n.kids.length&&rc.anc.length){path=rc.anc.slice();sel=path[path.length-1].kids.indexOf(rc.n)}else{path=rc.anc.concat([rc.n]);sel=-1}R()}
function PN(){var h=hub(),r=h.kids[sel],s='<div class="c" id="pn">';
if(toast)s+='<div class="ts">★ '+e(toast)+'</div>';
if(!r)return s+'<div class="m">Tap a road to open its details. Road length shows its steps. Each footprint is a quarter step (zoom in to see them). A flag marks a note: tap it to read. A ring with a number means sub-roads.</div></div>';
s+='<input value="'+e(r.n)+'" onchange="rr(this.value)" aria-label="Road name"/>';
if(r.kids.length){
s+='<div class="r"><span class="m">Sub-roads</span><b>'+r.kids.length+'</b></div><div class="r"><span class="m">Total steps</span><b>'+tot(r)+'</b></div><div class="r"><span class="m">Overall</span><b>'+Math.round(pr(r)*100)+'%</b></div>';
r.kids.slice(0,10).forEach(function(c){s+='<div class="r m"><span>'+e(tr(c.n,24))+'</span><span>'+Math.round(pr(c)*100)+'%</span></div>'});
s+='<button class="p" style="width:100%;margin-top:8px" onclick="op()">Open sub-roads</button>'}
else{var d=Math.floor(r.p+1e-4),f=r.p/r.N,nx=0;[25,50,75,100].forEach(function(q){if(!nx&&q/100>f+1e-4)nx=q});
s+='<div class="g2"><label class="m">Steps done<input type="number" min="0" step="0.25" value="'+r.p+'" onchange="sd(this.value)"/></label><label class="m">Road length (steps)<input type="number" min="1" step="1" value="'+r.N+'" onchange="sl(this.value)"/></label></div>';
s+='<div class="r"><span class="m">'+(f>=1?"Road complete":"Next celebration")+'</span><b>'+(f>=1?"100%":nx+"%")+'</b></div>';
s+='<div class="g2"><button onclick="inc(.25)">+ quarter</button><button onclick="inc(.5)">+ half</button><button onclick="inc(1)">+ full step</button><button onclick="inc(-.25)">− undo quarter</button></div>';
s+='<div style="margin-top:12px"><b>Notes on this road</b></div><div class="m">Tip: tap a dot on this road to add a note at that step.</div><label class="m" style="margin-top:6px">Step number<input id="ns" type="number" min="1" value="'+(dS||Math.min(r.N,d+1))+'"/></label><textarea id="nt" placeholder="Today I read 30 pages. Chapter 4.">'+e(dT)+'</textarea><button class="p" style="width:100%;margin-top:6px" onclick="sn()">Save note</button>';
Object.keys(r.notes).sort(function(a,b){return b-a}).forEach(function(k){s+='<div class="r" style="border-top:1px solid var(--bd);margin-top:6px;padding-top:6px;gap:8px;align-items:flex-start"><div><b>Step '+k+'</b><div class="m" style="white-space:pre-wrap">'+e(r.notes[k])+'</div></div><div style="white-space:nowrap"><button onclick="en('+k+')">Edit</button> <button onclick="dn('+k+')">×</button></div></div>'});
s+='<button style="width:100%;margin-top:10px" onclick="op()">Split into sub-roads</button>'}
return s+'<button style="width:100%;margin-top:8px" onclick="rm()">'+(arm==1?"Tap again to remove":"Remove road")+'</button></div>'}
function AF(){var s='<div class="c"><b>Add a road to '+e(tr(hub().n,22))+'</b><div class="g2"><input id="rn2" placeholder="Islamiat"/><input id="rs" type="number" min="1" step="1" value="30" aria-label="Steps"/></div><div class="m" style="margin:4px 0 8px">Name, then road length in steps (30, 365 or any number). A longer road is drawn longer.</div><button class="p" style="width:100%" onclick="ar()">Add road</button></div>';
if(path.length==1)s+='<button style="width:100%;margin-top:10px" onclick="dm()">'+(arm==2?"Tap again to delete":"Delete this goal")+'</button>';
